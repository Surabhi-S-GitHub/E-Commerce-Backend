# Application Name
spring.application.name=ecommerce

# Server Configuration
server.port=5454

# Database Configuration (Secure)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/ecommerce_project
spring.datasource.username=root
spring.datasource.password=Surabhi@SQL1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate & JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Logging (For Debugging SQL Queries)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Secret Key (Secure)
jwt.secret=MySuperSecretKeyForJWTThatIsAtLeast32Chars!
